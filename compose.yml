services:
  valheim:
    image: ghcr.io/community-valheim-tools/valheim-server:latest
    container_name: valheim-server
    cap_add:
      - sys_nice # Allows the server to prioritize its CPU thread to prevent lag
    # network_mode: host bypasses Docker NAT/proxy overhead for the lowest UDP latency on Linux
    network_mode: host
    # ports:
    #   - 2456-2458:2456-2458/udp
    environment:
      - SERVER_NAME=ValheimHard
      - WORLD_NAME=valheimhard
      - SERVER_PASS=12345 # Min 5 chars. Cannot be part of the server name.
      - SERVER_PUBLIC=true
      - TZ=Africa/Johannesburg # Syncs automatic backups and restarts to your local timezone
      - CROSSPLAY=false # Disabled to use direct Steam Networking instead of high-latency PlayFab relays
      - BACKUPS=true # Creates automatic zip backups of your world
      - UPDATE_CRON=0 4 * * * # Checks for game updates once daily at 4:00 AM instead of every 15 min
      - RESTART_CRON=0 5 * * * # Automatically restarts at 5:00 AM daily
      - SERVER_ARGS=-preset hard
      - BEPINEX=true
      # Only downloads world save if /config/worlds_local/valheimhard does not exist at all (never overwrites existing worlds)
      - PRE_BOOTSTRAP_HOOK=[ ! -d /config/worlds_local/valheimhard ] && echo "Downloading Valheim world and mods from GitHub..." && curl -fsSL https://github.com/LukeKappa/valheim-backup/releases/download/v2026.09.24/valheim-server-config.tar.gz | tar -xz -C /config
      - PRE_BEPINEX_CONFIG_HOOK=[ -n "$$plugins_path" ] && mkdir -p "$$plugins_path"
      # Auto-updater for BepInEx plugins (Jotunn, ValheimCommunityPatch, NetworkPerformanceSystem) on restart (never touches world saves)
      - PRE_SERVER_RUN_HOOK=curl -fsSL https://raw.githubusercontent.com/LukeKappa/valheim-backup/main/config/bepinex/update-mods.sh | bash
    volumes:
      - ./config:/config
      - ./data:/opt/valheim
    restart: unless-stopped
    stop_grace_period: 2m # Gives the server time to save the world before Docker kills it
