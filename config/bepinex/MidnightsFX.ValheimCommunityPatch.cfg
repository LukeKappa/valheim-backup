Object Unload Sweep Interval = 100

## The per-frame object spawn budget is the spawn backlog divided by this (minimum 10 for near objects, exactly like vanilla). 100 is vanilla's hardcoded value. Higher spawns fewer objects per frame when entering a built-up area - smaller frame hits, slower pop-in.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 10 to 2000
Spawn Burst Divisor = 100

## How much a piece's structural support must change before its neighbours are re-checked. Support propagates through a structure as a wave, and re-checking neighbours on every last-decimal drift keeps the whole structure awake; a difference this small never accumulates, because each hop can only shrink it. Support values run to a thousand, so the default is far below anything that affects whether a build stands. 0 restores the exact comparison.
# Setting type: Single
# Default value: 0.01
# Acceptable value range: From 0 to 1
Support Change Threshold = 0.01

## How many times in a row a building piece must re-check its support and get the same answer before it is allowed to take a slower look when only a neighbour's value drifted. In a large base the re-check signal is almost always on, so without this the skip never happens; a piece that has proven it is not moving can afford to see a small neighbouring drift a little late. Anything structural - building, destroying, damage, repairs, terrain edits - is always immediate, and any real change resets the piece's patience to zero. 0 turns this off.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 10
Settled Piece Patience = 3

## How many departed objects may be handed to the engine for destruction in a single unload pass. Destroying an object is mostly engine work that happens in one burst at the end of the frame, so a pass that unloads thousands at once - arriving through a portal, respawning, or a world load settling - is a visible freeze no matter how fast the game's own bookkeeping is. Capping the pass turns that freeze into a short, shallow dip. The remainder unloads on the following passes; until then it lingers at the far edge of the loaded distance, where nothing can see it. Raise it to unload faster and hitch harder, lower it for the reverse. 0 unloads everything at once, exactly like vanilla.
# Setting type: Int32
# Default value: 250
# Acceptable value range: From 0 to 20000
Object Unload Frame Budget = 250

Max Physics Steps Per Frame = 8

[Fixes - Server Memory]

## (server) Drops the server's record of a destroyed object once it is a few minutes old. The server keeps the id of every object destroyed since the world loaded, so a stale copy a player sends back cannot bring it back, and never clears that list while the world is loaded; every arrow, dropped item, felled tree and killed creature adds to it for the life of the process. The stale copies it guards against arrive within seconds of the destroy. Off by default.
# Setting type: Boolean
# Default value: false
Evict Dead ZDO Records = false

## How long the record of a destroyed object is kept. Well above the seconds a stale copy can be in flight; raise it rather than lower it if players ever report a destroyed object coming back.
# Setting type: Single
# Default value: 600
# Acceptable value range: From 60 to 3600
Dead ZDO Retain Seconds = 600

## (server) Caps the pools that recycle objects' field tables, and clears the strings and byte arrays a recycled table still points at. Without it the pools hold as many tables as were ever in use at once, each keeping its last contents alive, so memory never comes back down from the busiest moment since the world loaded. Off by default.
# Setting type: Boolean
# Default value: false
Trim ZDO Data Pool = false

## Tables of each field type kept for reuse. Tables released beyond this are left to the garbage collector; new ones are created again when needed.
# Setting type: Int32
# Default value: 4096
# Acceptable value range: From 0 to 100000
ZDO Data Pool Max Depth = 4096

## (server) Writes an object's fields to the network straight from where they are stored, instead of copying every field list first. Vanilla copies all seven of an object's field tables into fresh lists and allocates seven callbacks each time it serialises one object for one player, which keeps the garbage collector busy on a full server. The bytes sent are identical. Off by default.
# Setting type: Boolean
# Default value: false
Fix ZDO Serialize Allocation = false

[Fixes - Terrain]

## (client) Computes terrain lighting normals across zone boundaries instead of per zone. Vanilla shades the same ground differently on each side of a 64m zone border, which shows up as a hard crease running through flat terrain - most noticeable in the Plains and Meadows.
# Setting type: Boolean
# Default value: true
Fix Terrain Seams = true

## (client) Makes terrain paint agree along zone boundaries. Vanilla can end up with dirt painted on only one side of a 64m zone border, which draws a hard straight line across the ground. Paint that the ground next to the border already carries is carried across the boundary; a lone stripe sitting on the border with nothing behind it on either side is removed.
# Setting type: Boolean
# Default value: true
Fix Terrain Paint Seams = true

## (both) Sends terrain paint to every zone the paint actually covers. Vanilla measures which zones an edit touches from its radius, but the paint itself reaches about a metre further west and south, so the neighbouring zone never records paint applied to ground it shares - which is what leaves dirt stopping dead along a 64m zone border.
# Setting type: Boolean
# Default value: true
Fix Terrain Paint Zone Fanout = true

## (client) Corrects the array stride and bounds used when reading and writing terrain paint. Vanilla indexes a 33-wide paint array with a stride of 32, which skews the paint diagonally, and refuses to write the row and column each zone shares with its neighbour.
# Setting type: Boolean
# Default value: true
Fix Terrain Paint Mask Indexing = true

## (both) Recovers a terrain compiler that loaded before its zone's heightmap existed. In vanilla it throws a NullReferenceException every frame from then on and that zone stops accepting terrain edits entirely.
# Setting type: Boolean
# Default value: true
Fix Terrain Compiler Init Race = true

